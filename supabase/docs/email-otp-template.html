<div style="margin:0;padding:0;background:#F5F2EC;color:#1A1A1A;font-family:'DM Sans',Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;padding:22px 16px;">
    <div style="background:#1A1A1A;border-radius:28px;padding:28px 24px;color:#FFFFFF;">
      <div style="color:#C8F135;font-family:Georgia,serif;font-size:30px;line-height:1;font-weight:400;">MRSA</div>

      <p style="margin:34px 0 0;color:#8A8A8A;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;">
        Login Code
      </p>

      <h1 style="margin:8px 0 0;font-family:Georgia,serif;font-size:42px;line-height:.96;font-weight:400;color:#FFFFFF;">
        Enter code
      </h1>

      <div style="margin-top:22px;border:1px solid rgba(200,241,53,.38);border-radius:22px;background:rgba(200,241,53,.12);padding:18px;text-align:center;color:#C8F135;font-family:Georgia,serif;font-size:40px;line-height:1;font-weight:400;letter-spacing:7px;">
        {{ .Token }}
      </div>

      <p style="margin:16px 0 0;color:#BBBBBB;font-size:14px;line-height:1.45;">
        Use this one-time code in the MRSA app. It expires soon and can only be used once.
      </p>
    </div>

    <p style="margin:14px 4px 0;color:#8A8A8A;font-size:12px;line-height:1.45;">
      If you did not request this code, you can ignore this email.
    </p>
  </div>
</div>
