<div style="margin:0;padding:0;background:#f4f1ea;color:#18181a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
  <div style="max-width:390px;margin:0 auto;padding:14px 12px;">
    <div style="overflow:hidden;border:0.5px solid #e5e1d9;border-radius:20px;background:#ffffff;box-shadow:0 16px 42px rgba(24,24,26,0.09);">
      <div style="position:relative;background:#0c3b20;padding:20px 20px 22px;color:#ffffff;">
        <div style="position:absolute;inset:0;opacity:0.08;background-image:linear-gradient(90deg,rgba(255,255,255,0.45) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,0.45) 1px,transparent 1px);background-size:92px 92px;pointer-events:none;"></div>
        <div style="position:relative;">
          <div style="font-size:24px;line-height:1;font-weight:500;letter-spacing:-0.4px;color:#ffffff;">MRSA</div>
          <div style="margin-top:18px;display:inline-block;border-radius:999px;background:rgba(255,255,255,0.12);padding:5px 10px;color:rgba(255,255,255,0.76);font-size:12px;line-height:1;">
            Access code
          </div>
          <h1 style="margin:10px 0 0;font-size:28px;line-height:1.05;font-weight:500;letter-spacing:-0.4px;color:#ffffff;">
            Enter code.
          </h1>
          <p style="margin:8px 0 0;color:rgba(255,255,255,0.72);font-size:13px;line-height:1.45;">
            Use this to sign in to MRSA.
          </p>
        </div>
      </div>

      <div style="padding:18px;">
        <div style="border:0.5px solid #d0cbc0;border-radius:16px;background:#f8fbf4;padding:16px 12px;text-align:center;color:#0c3b20;font-size:30px;line-height:1;font-weight:500;letter-spacing:7px;font-variant-numeric:tabular-nums;">
          {{ .Token }}
        </div>
        <p style="margin:12px 0 0;color:#9a9488;font-size:12px;line-height:1.45;">
          This code expires soon. Ignore this email if you did not request it.
        </p>
      </div>
    </div>

    <p style="margin:10px 4px 0;text-align:center;color:#9a9488;font-size:11px;line-height:1.35;">
      Mumineen Racquet Sports Association
    </p>
  </div>
</div>
